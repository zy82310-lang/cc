<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>彩模机位对照</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111110;color:#f1ebe3;font:14px/1.6 "PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:1376px;margin:auto;padding:clamp(20px,4vw,52px)}
header{margin-bottom:26px}
h1,h2,p,figure{margin:0}
h1{font:600 clamp(28px,4vw,42px)/1.3 "Songti SC","Noto Serif SC",serif}
header p,.muted,figcaption small{color:#bbb0a4}
header p{margin-top:8px}
button{font:inherit;color:#d4c9bd;background:transparent;border:1px solid transparent;border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover{background:#28231e;color:#f9efe4}
button[aria-pressed=true]{background:#2b2118;color:#ffd29e;border-color:#67482f}
button:focus-visible{outline:2px solid #efba82;outline-offset:2px}
.page-buttons,.styles{display:flex;gap:6px;flex-wrap:wrap}
nav{display:flex;flex-wrap:wrap;gap:14px 24px;border-bottom:1px solid #3a332d;padding-bottom:14px}
.page-group>span{display:block;color:#bbb0a4;margin-bottom:5px;font-size:12px}
.page-buttons button{min-width:36px;padding:6px;font-variant-numeric:tabular-nums}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin:22px 0 16px}
h2{font-size:20px;font-weight:600}
.status{color:#e6b588;font-size:13px;margin-top:2px}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
figure{background:#1b1917;border-radius:8px;overflow:hidden}
figcaption{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px}
.stage{display:grid;place-items:center;aspect-ratio:16/9;background:#0b0b0a;color:#bbb0a4;text-align:center}
.stage img{display:block;width:100%;height:100%;object-fit:contain;min-height:0}
.note{margin-top:14px;padding:10px 0 10px 13px;border-left:2px solid #a97649;color:#e2d6c9}
@media(max-width:700px){.pair{grid-template-columns:1fr}.top{margin-top:14px}nav button{padding-inline:8px}}
</style>
<main>
  <header>
    <h1>彩模机位对照</h1>
    <p>26.11.8 彩模 · 全部 21 页。按页码查看对应机位，切换同一视角的渲染方案。</p>
  </header>
  <nav aria-label="按彩模页码切换">

    <div class="page-group" role="group" aria-label="阳台与卫浴"><span>阳台与卫浴</span><div class="page-buttons"><button type="button" data-angle="10" aria-pressed="false" aria-label="第 11 页 · 阳台看向洗烘柜端" title="阳台看向洗烘柜端">11</button><button type="button" data-angle="11" aria-pressed="false" aria-label="第 12 页 · 阳台看向绿植端" title="阳台看向绿植端">12</button><button type="button" data-angle="12" aria-pressed="false" aria-label="第 13 页 · 水槽旁看向走廊" title="水槽旁看向走廊">13</button><button type="button" data-angle="13" aria-pressed="false" aria-label="第 14 页 · 正对卫浴干区" title="正对卫浴干区">14</button><button type="button" data-angle="14" aria-pressed="false" aria-label="第 15 页 · 从淋浴侧看马桶与干区" title="从淋浴侧看马桶与干区">15</button></div></div>
    <div class="page-group" role="group" aria-label="卧室与书房"><span>卧室与书房</span><div class="page-buttons"><button type="button" data-angle="15" aria-pressed="false" aria-label="第 16 页 · 次卧入口看向书桌与窗" title="次卧入口看向书桌与窗">16</button><button type="button" data-angle="16" aria-pressed="false" aria-label="第 17 页 · 从书桌侧回看斗柜与房门" title="从书桌侧回看斗柜与房门">17</button><button type="button" data-angle="17" aria-pressed="false" aria-label="第 18 页 · 次卧正对书桌" title="次卧正对书桌">18</button><button type="button" data-angle="18" aria-pressed="false" aria-label="第 19 页 · 过道看向主卧与次卧" title="过道看向主卧与次卧">19</button><button type="button" data-angle="19" aria-pressed="false" aria-label="第 20 页 · 主卧床尾看向床头" title="主卧床尾看向床头">20</button><button type="button" data-angle="20" aria-pressed="false" aria-label="第 21 页 · 主卧床头看向门与衣柜" title="主卧床头看向门与衣柜">21</button></div></div>
  </nav>

        <button type="button" data-style="1" aria-pressed="false">方案 B · 法式中古</button>

      <figure>

      </figure>
      <figure>

        <div class="stage" id="render-stage"></div>

  </section>
</main>
<script>
const angles = [{"page": 1, "title": "从过道门框看向阳台", "note": "近处是过道门框，远处是阳台窗帘。餐桌从左边露出，右侧柜体只露局部。原彩模两边的白色留边保留。", "original": "assets/media/7464034dfd06.jpg", "renders": ["assets/media/849aebd3f795.jpg", "assets/media/b04ea80ece39.jpg", "assets/media/72b47b49462a.jpg", null], "statuses": ["按彩模补绘", "按彩模补绘", "按彩模补绘", null], "styleNotes": {}}, {"i": 3, "page": 2, "title": "厨房看向入户门", "note": "左侧水槽和岛台、正前入户门、右侧餐边柜相符。冰箱及高柜的饰面和分缝有变化。", "original": "assets/media/fcc3f9b62a2c.jpg", "renders": ["assets/media/99a93047cbe1.webp", "assets/media/27182efd90e2.webp", "assets/media/da4bcad72e0c.webp", "assets/media/2d780a64d732.jpg"], "supplemental": false}, {"page": 3, "title": "从客厅斜看岛台与入户门", "note": "核对左后方木门、中央岛台、右侧入户门和最右通顶柜。传统柚木版来自现有厨房主图。", "original": "assets/media/9ce68316c686.jpg", "renders": ["assets/media/27ad07fafe3b.jpg", "assets/media/c0ff1e92c5c4.jpg", "assets/media/0adbb0875c2c.jpg", "assets/media/0437336a7725.jpg"], "statuses": ["已按彩模修正", "已按彩模修正", "已按彩模修正", "沿用已有图"], "styleNotes": {}}, {"i": 4, "page": 4, "title": "从客厅看走廊与岛台", "note": "电视墙余边在左、走廊在岛台左侧、右侧是高柜。若要核实通行宽度，需回到带尺寸的原图。", "original": "assets/media/08e99229dcf2.jpg", "renders": ["assets/media/8143ce6095c3.webp", "assets/media/978685ba4fd4.webp", "assets/media/dceba964de7f.webp", "assets/media/0b382f01eaad.jpg"], "supplemental": false}, {"i": 1, "page": 5, "title": "客餐厅看向厨房", "note": "左侧落地窗和餐桌、中间电视墙、右侧厨房岛台的位置相符。渲染图的木色与顶面造型有变化。", "original": "assets/media/51842db95076.jpg", "renders": ["assets/media/15ee434e8607.webp", "assets/media/9e0de5fb56a4.webp", "assets/media/03f3fc79d436.webp", "assets/media/9023cc95aaac.jpg"], "supplemental": false}, {"page": 6, "title": "隔着岛台看向餐边柜", "note": "灰色台面在左前方，冰箱、餐边柜、黑圆桌由左到右可见，沙发只露右侧一角。 餐边柜方案采用吊柜和下柜上下同宽，中间留操作台面。渲染图的边缘位置可与此要求对照。", "original": "assets/media/9a664d2a7c7d.jpg", "renders": ["assets/media/a0cae6e651d5.jpg", "assets/media/9f0550142e31.jpg", "assets/media/121cce5e9bdf.jpg", null], "statuses": ["按彩模补绘", "按彩模补绘", "按彩模补绘", null], "styleNotes": {}}, {"page": 7, "title": "从电视墙侧斜看餐客厅", "note": "左侧是入户门和冰箱，黑圆桌接近餐边柜，沙发和挂画在右侧。 餐边柜方案采用吊柜和下柜上下同宽，中间留操作台面。渲染图的边缘位置可与此要求对照。", "original": "assets/media/bf4ae4e6ba2d.jpg", "renders": ["assets/media/551762c6aef0.jpg", "assets/media/99260142a382.jpg", "assets/media/2a571b7aebaa.jpg", null], "statuses": ["按彩模补绘", "按彩模补绘", "按彩模补绘", null], "styleNotes": {}}, {"page": 8, "title": "正对餐边柜、沙发与阳台帘", "note": "餐边柜与沙发沿同一面墙布置，最右侧通过窗帘边缘看见叠放洗烘机。 餐边柜方案采用吊柜和下柜上下同宽，中间留操作台面。渲染图的边缘位置可与此要求对照。", "original": "assets/media/7c331a3b8805.jpg", "renders": ["assets/media/3cd5d77b190d.jpg", "assets/media/cec55b8fc0f4.jpg", "assets/media/92d9299dd7b6.jpg", "assets/media/94c05b66129e.jpg"], "statuses": ["按彩模补绘", "按彩模补绘", "按彩模补绘", null], "styleNotes": {}}, {"i": 2, "page": 9, "title": "正对电视墙", "note": "左侧阳台开口、正前电视墙、右侧厨房相符。电视墙分缝和地柜样式随方案改变。", "original": "assets/media/5dd78425ecfa.jpg", "renders": ["assets/media/ff52d125b48d.webp", "assets/media/d5c0f0395aa0.webp", "assets/media/943774d61c64.webp", "assets/media/2977ccef8269.jpg"], "supplemental": false}, {"page": 10, "title": "从阳台侧回看入户门", "note": "左侧是电视墙，右侧是沙发与餐边柜，入户门在远端。这个方向与正对电视墙的机位不同。", "original": "assets/media/77405f046a91.jpg", "renders": ["assets/media/3fa2c8700ae5.jpg", "assets/media/6164293af7c3.jpg", "assets/media/66defbcb2421.jpg", null], "statuses": ["按彩模补绘", "按彩模补绘", "按彩模补绘", null], "styleNotes": {}}, {"page": 11, "title": "阳台看向洗烘柜端", "note": "四种风格沿用现有阳台主图。左侧是推拉门，右侧是栏杆，叠放洗烘机在尽头。", "original": "assets/media/7d0f9ceec996.jpg", "renders": ["assets/media/66d679cc87ac.jpg", "assets/media/1e77763216c4.jpg", "assets/media/bccd2c1fd5f6.jpg", "assets/media/6ecce3c36681.jpg"], "statuses": ["沿用已有图", "沿用已有图", "沿用已有图", "沿用已有图"], "styleNotes": {}}, {"i": 7, "page": 12, "title": "阳台看向绿植端", "note": "左侧栏杆、右侧玻璃门和尽头绿植相符。注意这和另一端的洗烘柜机位方向相反。", "original": "assets/media/713dfa92e71f.jpg", "renders": ["assets/media/50ae371133e8.webp", "assets/media/e1233e30082e.webp", "assets/media/338347e9efde.webp", "assets/media/f98467b13076.jpg"], "supplemental": true}, {"i": 5, "page": 13, "title": "水槽旁看向走廊", "note": "走廊尽头已改为与彩模一致的闭合门。洗手台仅从隔墙边露出一角。局部顶面饰面可结合素白平顶要求再确认。", "original": "assets/media/f39490767036.jpg", "renders": ["assets/media/2c34beec1a14.jpg", "assets/media/4389d3b9057d.jpg", "assets/media/a74acdf387ba.jpg", "assets/media/d3ee3063069c.jpg"], "supplemental": false, "statuses": [null, null, null, "按彩模核对走廊门与干区"]}, {"i": 6, "page": 14, "title": "正对卫浴干区", "note": "左侧淋浴玻璃、中间洗手台、右侧水平岛台的关系相符。渲染图的玻璃通透度、镜面和灯光与彩模不同。", "original": "assets/media/9f3ad3f14317.jpg", "renders": ["assets/media/7bf117d246b1.webp", "assets/media/e43279af213d.jpg", "assets/media/5f50f6e274e4.jpg", "assets/media/3bcb722a44b5.jpg"], "supplemental": false, "statuses": [null, null, null, "沿用传统柚木卫浴主图"]}, {"page": 15, "title": "从淋浴侧看马桶与干区", "note": "核对花洒、窄窗下的马桶、门框后的洗手台，以及最右端局部岛台。这是与卫浴干区正视不同的机位。", "original": "assets/media/891c2c2b43f9.jpg", "renders": ["assets/media/2e539c0aae75.jpg", "assets/media/7179e9a0a7da.jpg", "assets/media/46912b2fad38.jpg", null], "statuses": ["按彩模补绘", "按彩模补绘", "按彩模补绘", null], "styleNotes": {"A": "干区顶部仍可见局部木色收边，饰面以最终施工方案为准。", "B": "干区顶部仍可见局部木色收边，饰面以最终施工方案为准。", "C": "干区顶部仍可见局部木色收边，饰面以最终施工方案为准。"}}, {"i": 8, "page": 16, "title": "次卧入口看向书桌与窗", "note": "核对黑书桌在左、窗在正前、单人床和斗柜在右的关系。", "original": "assets/media/4ddc961c6be6.jpg", "renders": ["assets/media/b2485adfaa3f.webp", "assets/media/656aab8e2fac.webp", "assets/media/513f5db6cc5e.webp", "assets/media/9063ff81b4c7.jpg"], "supplemental": true}, {"page": 17, "title": "从书桌侧回看斗柜与房门", "note": "左侧是窗帘和床尾，中间是搁板与斗柜，关闭的卧室门在右侧。", "original": "assets/media/8d68ff20e324.jpg", "renders": ["assets/media/827ee33cbd9b.jpg", "assets/media/dafd43a731f6.jpg", "assets/media/e0740e2fea72.jpg", null], "statuses": ["按彩模补绘", "按彩模补绘", "按彩模补绘", null], "styleNotes": {}}, {"i": 9, "page": 18, "title": "次卧正对书桌", "note": "核对左门、正前书桌和右侧靠窗的床。", "original": "assets/media/b9df260424a5.jpg", "renders": ["assets/media/edf28981eead.webp", "assets/media/f5e1ec4180dc.jpg", "assets/media/9d7e5ee2bfe9.webp", "assets/media/f6a4cfd45c03.jpg"], "supplemental": true}, {"i": 10, "page": 19, "title": "过道看向主卧与次卧", "note": "核对过道实体隔墙、左侧书桌、右侧靠窗地台床。", "original": "assets/media/7945f189089a.jpg", "renders": ["assets/media/32e527a42b55.webp", "assets/media/1109249dc2f8.webp", "assets/media/a34530b463f1.webp", "assets/media/5c74528af8cd.jpg"], "supplemental": true}, {"i": 11, "page": 20, "title": "主卧床尾看向床头", "note": "核对左窗、正前床头和右侧衣柜，不同方案的窗帘和饰面有变化。", "original": "assets/media/d1a2ba557182.jpg", "renders": ["assets/media/6719863b312d.webp", "assets/media/4c1041df3dcf.webp", "assets/media/175f97dc6148.webp", "assets/media/40f613407a42.jpg"], "supplemental": true}, {"i": 12, "page": 21, "title": "主卧床头看向门与衣柜", "note": "核对左侧梳妆台、正前门和右侧衣柜。", "original": "assets/media/7163f7edc94d.jpg", "renders": ["assets/media/5cb93ea8df95.webp", "assets/media/80b023f4ee90.webp", "assets/media/b88dbbf6c5b7.webp", "assets/media/2af789c1fa95.jpg"], "supplemental": true}];
const angleButtons = [...document.querySelectorAll('[data-angle]')];
const styleButtons = [...document.querySelectorAll('[data-style]')];
let angle = 0;
let style = 0;

function render() {
  const view = angles[angle];
  styleButtons[3].hidden = !view.renders[3];
  if (!view.renders[3] && style === 3) style = 0;
  const image = view.renders[style];
  const styleName = styleButtons[style].textContent;
  angleButtons.forEach((button, index) => button.setAttribute('aria-pressed', String(angle === index)));
  styleButtons.forEach((button, index) => button.setAttribute('aria-pressed', String(style === index)));
  document.querySelector('#angle-title').textContent = '第 ' + view.page + ' 页' + ' · ' + view.title;
  document.querySelector('#status').textContent = !image ? '待补渲染图' : view.statuses?.[style] || (view.page === 13 ? '已修正走廊门与干区' : '主要空间关系相符');
  document.querySelector('#page-number').textContent = 'PDF 第 ' + view.page + ' 页';
  const original = document.querySelector('#original');
  original.alt = '原始彩模，' + view.title;
  if (original.getAttribute('src') !== view.original) original.src = view.original;
  document.querySelector('#render-label').textContent = styleName;
  const stage = document.querySelector('#render-stage');
  stage.textContent = image ? '' : '当前方案暂无这个机位的渲染图';
  if (image) {
    const renderImage = new Image();
    renderImage.alt = styleName + '，' + view.title;
    renderImage.src = image;
    stage.append(renderImage);
  }
  document.querySelector('#note').textContent = image ? [view.note, view.styleNotes?.['ABC'[style]]].filter(Boolean).join(' ') : '可切换其他方案，查看该机位的渲染对照。';
}

angleButtons.forEach(button => button.addEventListener('click', () => {
  angle = Number(button.dataset.angle);
  render();
}));
styleButtons.forEach(button => button.addEventListener('click', () => {
  style = Number(button.dataset.style);
  render();
}));
render();
</script>
</html>
